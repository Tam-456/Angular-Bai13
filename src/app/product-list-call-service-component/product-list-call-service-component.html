<p>product-list-call-service-component works!</p>
<div>
  Min price: <input type="number" [(ngModel)]="minPrice" />
  Max price: <input type="number" [(ngModel)]="maxPrice" />
  <button (click)="doFilter()">Filter</button>
</div>
<ol>
  <li *ngFor="let p of products">
    {{ p.name }} - {{ p.price }}
    <img [src]="p.image" [alt]="p.name" width="100" height="100" />
  </li>
</ol>
