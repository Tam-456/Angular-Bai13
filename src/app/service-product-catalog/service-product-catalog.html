<p>Bài 14: Json Array Model: Product - Catalog</p>

<div *ngFor="let c of categories" style="margin-bottom: 20px;">
  <table border="1" style="border-collapse: collapse; width: 450px;">
    <tr style="background-color: #f2f2f2;">
      <th style="width: 50%;">Ma Danh Muc</th>
      <th style="width: 50%;">Ten Danh Muc</th>
    </tr>
    <tr>
      <td>{{ c.Cateid }}</td>
      <td>{{ c.CateName }}</td>
    </tr>
    <tr>
      <td colspan="2" style="padding: 0;">
        <table border="1" style="border-collapse: collapse; width: 100%; text-align: center;">
          <tr style="background-color: #fafafa;">
            <th>Ma San Pham</th>
            <th>Ten San Pham</th>
            <th>Gia San Pham</th>
            <th>Picture</th>
          </tr>
          <tr *ngFor="let p of c.Products">
            <td>{{ p.ProductId }}</td>
            <td>{{ p.ProductName }}</td>
            <td>{{ p.Price }}</td>
            <td>
              <img [src]="p.Image" width="70" height="70" style="object-fit: contain;" />
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
